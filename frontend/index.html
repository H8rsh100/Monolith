<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IBM 3270 Mainframe Terminal - Monolith COBOL Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            colors: {
              crtBg: '#050a05',
              crtGreen: '#00FF66',
              crtAmber: '#FFB000',

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="bg-crtBg text-crtGreen font-mono antialiased min-h-screen overflow-hidden selection:bg-crtGreen selection:text-black">
