[project]
name = "monolith-backend"
version = "1.0.0"
description = "Enterprise COBOL Mainframe Modernization Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "networkx>=3.3",
    "python-multipart>=0.0.9",
    "requests>=2.32.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1"
]

[tool.vercel]
entrypoint = "api/index.py"
